name: Game Performance Guardian

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      investigate:
        description: "Optional AI investigation mode"
        required: true
        default: on-failure
        type: choice
        options:
          - never
          - on-failure
          - always

permissions:
  contents: read

jobs:
  # Pull requests compare the candidate against the protected base.
  pull-request-performance:
    if: github.event_name == 'pull_request'
    uses: TaofeekS/godot_performance_guardian/.github/workflows/reusable-performance-guardian.yml@7622997bd3a9c5d166703e578af943b7e25f61ba
    with:
      project-path: .
      scene-path: res://main.tscn
      profile: main_scene
      budget-file: budgets/comparison_budgets.json
      godot-version: "4.5.1"
      use-dotnet: false
      warmup-frames: 120
      measured-frames: 600
      sampling-interval: 1
      capture-runs: 3
      compare-with-base: false
      investigate: never

  # Manual runs remain absolute-only and may optionally use AI.
  manual-performance:
    if: github.event_name == 'workflow_dispatch'
    uses: TaofeekS/godot_performance_guardian/.github/workflows/reusable-performance-guardian.yml@7622997bd3a9c5d166703e578af943b7e25f61ba
    with:
      project-path: .
      scene-path: res://main.tscn
      profile: main_scene
      budget-file: budgets/comparison_budgets.json
      godot-version: "4.5.1"
      use-dotnet: false
      warmup-frames: 120
      measured-frames: 600
      sampling-interval: 1
      capture-runs: 3
      compare-with-base: false
      investigate: ${{ inputs.investigate }}
      openai-model: gpt-4.1-mini
    secrets:
      openai-api-key: ${{ secrets.OPENAI_API_KEY }}
