name: Game Performance Guardian

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      investigate:
        description: "Optional AI investigation mode"
        required: true
        default: on-failure
        type: choice
        options:
          - never
          - on-failure
          - always

permissions:
  contents: read

jobs:
  # Pull requests run deterministic validation and budgets without
  # receiving the OpenAI secret.
  pull-request-performance:
    if: github.event_name == 'pull_request'
    uses: TaofeekS/godot_performance_guardian/.github/workflows/reusable-performance-guardian.yml@820abbaf5472c1efb7546fe17f47015d249fa397
    with:
      project-path: .
      profile: main_scene
      budget-file: performance_budgets.json
      godot-version: "4.5.1"
      use-dotnet: false
      warmup-frames: 120
      measured-frames: 600
      sampling-interval: 1
      capture-runs: 3
      investigate: never

  # Manual runs may use the secret for an optional explanation.
  manual-performance:
    if: github.event_name == 'workflow_dispatch'
    uses: TaofeekS/godot_performance_guardian/.github/workflows/reusable-performance-guardian.yml@820abbaf5472c1efb7546fe17f47015d249fa397
    with:
      project-path: .
      profile: main_scene
      budget-file: performance_budgets.json
      godot-version: "4.5.1"
      use-dotnet: false
      warmup-frames: 120
      measured-frames: 600
      sampling-interval: 1
      capture-runs: 3
      investigate: ${{ inputs.investigate }}
      openai-model: gpt-4.1-mini
    secrets:
      openai-api-key: ${{ secrets.OPENAI_API_KEY }}