name: Game Performance Guardian

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      mode:
        description: "Run policy enforcement or generate a calibration proposal"
        required: true
        default: enforce
        type: choice
        options:
          - enforce
          - calibrate
      investigate:
        description: "Optional AI investigation mode for enforcement only"
        required: true
        default: on-failure
        type: choice
        options:
          - never
          - on-failure
          - always

permissions:
  contents: read

jobs:
  # Pull requests remain deterministic-only and use committed policy.
  pull-request-performance:
    if: github.event_name == 'pull_request'
    uses: TaofeekS/godot_performance_guardian/.github/workflows/reusable-performance-guardian.yml@ea6a5df84efa0c5eabe05477ac1720259e7323fa
    with:
      project-path: .
      scene-path: res://main.tscn
      profile: main_scene
      budget-file: budgets/comparison_budgets.json
      godot-version: "4.5.1"
      use-dotnet: false
      warmup-frames: 120
      measured-frames: 600
      sampling-interval: 1
      capture-runs: 3
      compare-with-base: false
      investigate: never

  # Manual enforcement may optionally receive the AI secret.
  manual-enforcement:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'enforce'
    uses: TaofeekS/godot_performance_guardian/.github/workflows/reusable-performance-guardian.yml@ea6a5df84efa0c5eabe05477ac1720259e7323fa
    with:
      mode: enforce
      project-path: .
      scene-path: res://main.tscn
      profile: main_scene
      budget-file: budgets/comparison_budgets.json
      godot-version: "4.5.1"
      use-dotnet: false
      warmup-frames: 120
      measured-frames: 600
      sampling-interval: 1
      capture-runs: 3
      compare-with-base: false
      investigate: ${{ inputs.investigate }}
      openai-model: gpt-4.1-mini
    secrets:
      openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  # Manual calibration creates a proposal only and receives no AI secret.
  manual-calibration:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'calibrate'
    uses: TaofeekS/godot_performance_guardian/.github/workflows/reusable-performance-guardian.yml@ea6a5df84efa0c5eabe05477ac1720259e7323fa
    with:
      mode: calibrate
      project-path: .
      scene-path: res://main.tscn
      profile: main_scene
      godot-version: "4.5.1"
      use-dotnet: false
      warmup-frames: 120
      measured-frames: 600
      sampling-interval: 1
      calibration-runs: 5
      compare-with-base: false
      investigate: never
